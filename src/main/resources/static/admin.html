<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园共享雨伞 · 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #FBC7D4;
            --primary-dark: #E8A5B8;
            --primary-light: #FFF0F5;
            --accent: #FFE4A8;
            --success: #22c55e;
            --warning: #d97706;
            --danger: #ef4444;
            --text-main: #6b5a4a;
            --text-sub: #c9b8a8;
            --bg: #FFF8E7;
            --card-bg: #ffffff;
            --border: #FDEEF4;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #FFF8E7 0%, #FDEEF4 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .navbar {
            background: linear-gradient(135deg, #FFE4A8 0%, #FBC7D4 100%);
            color: #6b5a4a;
            padding: 0 32px;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(251, 199, 212, 0.4);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .logo {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .navbar .logo-icon {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .navbar .right {
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 13px;
        }
        .navbar .time { color: #6b5a4a; opacity: 0.75; }
        .navbar .logout {
            padding: 8px 18px;
            background: rgba(255,255,255,0.5);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            color: #6b5a4a;
            font-weight: 500;
        }
        .navbar .logout:hover { background: rgba(255,255,255,0.75); }

        .container {
            display: flex;
            min-height: calc(100vh - 64px);
        }

        .sidebar {
            width: 220px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            flex-shrink: 0;
        }
        .menu-item {
            padding: 13px 24px;
            margin: 2px 12px;
            font-size: 14px;
            color: #8a7a6a;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 10px;
        }
        .menu-item:hover {
            background: #FFF0F5;
            color: #d97a92;
        }
        .menu-item.active {
            background: linear-gradient(135deg, #FFE4A8 0%, #FBC7D4 100%);
            color: #6b5a4a;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(251, 199, 212, 0.5);
        }
        .menu-icon { font-size: 18px; }
        .menu-badge {
            margin-left: auto;
            background: #ef4444;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
        }
        .menu-item.active .menu-badge {
            background: rgba(255,255,255,0.7);
            color: #d97a92;
        }

        .main {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
        }
        .page-header { margin-bottom: 24px; }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #6b5a4a;
            margin-bottom: 4px;
        }
        .page-sub {
            font-size: 13px;
            color: #c9b8a8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 22px 24px;
            box-shadow: 0 4px 20px rgba(251, 199, 212, 0.25);
            border: 1px solid var(--border);
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(251, 199, 212, 0.4);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: linear-gradient(180deg, #FFE4A8, #FBC7D4);
            border-radius: 4px 0 0 4px;
        }
        .stat-card.green::before { background: linear-gradient(180deg, #86efac, #22c55e); }
        .stat-card.orange::before { background: linear-gradient(180deg, #fcd34d, #d97706); }
        .stat-card.red::before { background: linear-gradient(180deg, #fca5a5, #ef4444); }

        .stat-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .stat-label {
            font-size: 13px;
            color: #c9b8a8;
            font-weight: 500;
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #FFF8E7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .stat-card.green .stat-icon { background: #dcfce7; }
        .stat-card.orange .stat-icon { background: #fef3c7; }
        .stat-card.red .stat-icon { background: #fee2e2; }

        .stat-num {
            font-size: 32px;
            font-weight: 700;
            color: #6b5a4a;
            line-height: 1.1;
        }
        .stat-num.green { color: var(--success); }
        .stat-num.orange { color: var(--warning); }
        .stat-num.red { color: var(--danger); }
        .stat-unit {
            font-size: 13px;
            color: #c9b8a8;
            margin-left: 4px;
            font-weight: 400;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .chart-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(251, 199, 212, 0.25);
        }
        .chart-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #6b5a4a;
        }
        .chart-sub {
            font-size: 12px;
            color: #c9b8a8;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 200px;
            gap: 12px;
            padding-top: 20px;
        }
        .bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            height: 100%;
            justify-content: flex-end;
        }
        .bar-value {
            font-size: 12px;
            font-weight: 600;
            color: #d97a92;
        }
        .bar {
            width: 100%;
            max-width: 40px;
            background: linear-gradient(180deg, #FFE4A8 0%, #FBC7D4 100%);
            border-radius: 8px 8px 0 0;
            transition: all 0.3s;
            min-height: 4px;
        }
        .bar-wrap:hover .bar {
            background: linear-gradient(180deg, #FFD88A 0%, #F8B5C7 100%);
        }
        .bar-label {
            font-size: 11px;
            color: #c9b8a8;
            white-space: nowrap;
        }

        .donut-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
        }
        .donut {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .donut-inner {
            width: 110px;
            height: 110px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 8px rgba(251, 199, 212, 0.2);
        }
        .donut-num {
            font-size: 28px;
            font-weight: 700;
            color: #6b5a4a;
            line-height: 1;
        }
        .donut-label {
            font-size: 11px;
            color: #c9b8a8;
            margin-top: 4px;
        }

        .table-wrap {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(251, 199, 212, 0.25);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 18px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: #FFF8E7;
            color: #8a7a6a;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: #FFF8E7; }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .tag.pass { background: #d1fae5; color: #059669; }
        .tag.reject { background: #fee2e2; color: #dc2626; }
        .tag.pending { background: #fef3c7; color: #d97706; }
        .tag.black { background: #fee2e2; color: #dc2626; }
        .tag.normal { background: #d1fae5; color: #059669; }

        .btn {
            padding: 7px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn-pass { background: var(--success); color: #fff; }
        .btn-pass:hover { background: #059669; }
        .btn-reject { background: var(--danger); color: #fff; }
        .btn-reject:hover { background: #dc2626; }
        .btn-black { background: #8a7a6a; color: #fff; }
        .btn-black:hover { background: #6b5a4a; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 22px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(251, 199, 212, 0.25);
            transition: all 0.25s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(251, 199, 212, 0.4);
        }
        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px dashed var(--border);
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #6b5a4a;
        }
        .card-score {
            font-size: 18px;
            font-weight: 700;
            color: var(--success);
        }
        .card-row {
            font-size: 13px;
            color: #8a7a6a;
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
        }
        .card-row .label { color: #c9b8a8; min-width: 60px; }
        .card-row .value { color: #6b5a4a; flex: 1; word-break: break-all; }
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin: 12px 0;
            cursor: zoom-in;
            border: 1px solid var(--border);
        }
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .card-actions .btn { flex: 1; padding: 10px; }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            background: #fff;
            color: #6b5a4a;
        }
        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(251, 199, 212, 0.25);
        }
        .search-bar button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #FFE4A8 0%, #FBC7D4 100%);
            color: #6b5a4a;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(251, 199, 212, 0.5);
        }
        .search-bar button:hover {
            box-shadow: 0 6px 20px rgba(251, 199, 212, 0.7);
            transform: translateY(-1px);
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #c9b8a8;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(251, 199, 212, 0.25);
        }
        .empty-icon { font-size: 60px; margin-bottom: 16px; opacity: 0.6; }
        .empty-text { font-size: 14px; }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }
        .pagination button {
            padding: 9px 18px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #6b5a4a;
            transition: all 0.2s;
        }
        .pagination button:hover:not(:disabled) {
            border-color: var(--primary);
            color: #d97a92;
            background: #FFF8E7;
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .page-info {
            font-size: 13px;
            color: #c9b8a8;
            padding: 0 8px;
        }

        .login-page {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #FFF8E7 0%, #FDEEF4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            overflow: hidden;
        }
        .login-page::before {
            content: '';
            position: absolute;
            top: -100px; right: -100px;
            width: 400px; height: 400px;
            background: linear-gradient(135deg, #FFE4A8, #FBC7D4);
            opacity: 0.4;
            border-radius: 50%;
        }
        .login-page::after {
            content: '';
            position: absolute;
            bottom: -150px; left: -100px;
            width: 500px; height: 500px;
            background: linear-gradient(135deg, #FBC7D4, #FFE4A8);
            opacity: 0.35;
            border-radius: 50%;
        }
        .login-box {
            background: #fff;
            border-radius: 24px;
            padding: 56px 48px;
            width: 420px;
            box-shadow: 0 24px 80px rgba(251, 199, 212, 0.5);
            position: relative;
            z-index: 1;
        }
        .login-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #FFE4A8, #FBC7D4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(251, 199, 212, 0.6);
        }
        .login-box h2 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #6b5a4a;
            margin-bottom: 6px;
        }
        .login-box .sub {
            text-align: center;
            font-size: 13px;
            color: #c9b8a8;
            margin-bottom: 36px;
        }
        .login-box input {
            width: 100%;
            padding: 15px 18px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
            transition: all 0.2s;
            background: #FFFAF0;
            color: #6b5a4a;
        }
        .login-box input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(251, 199, 212, 0.25);
        }
        .login-box .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FFE4A8 0%, #FBC7D4 100%);
            color: #6b5a4a;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(251, 199, 212, 0.6);
            letter-spacing: 2px;
        }
        .login-box .btn-login:hover {
            box-shadow: 0 8px 28px rgba(251, 199, 212, 0.8);
            transform: translateY(-1px);
        }
        .login-box .error {
            color: var(--danger);
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
            min-height: 18px;
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            padding: 14px 28px;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            z-index: 99999;
            transition: transform 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 8px 28px rgba(251, 199, 212, 0.5);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(107, 90, 74, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        .modal.show { display: flex; }
        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="login-page" id="loginPage">
    <div class="login-box">
        <div class="login-logo">🌂</div>
        <h2>管理后台</h2>
        <div class="sub">校园共享雨伞系统</div>
        <input type="text" id="loginUser" placeholder="管理员账号" value="admin" />
        <input type="password" id="loginPwd" placeholder="密码" value="admin123" />
        <div class="error" id="loginError"></div>
        <button class="btn-login" onclick="doLogin()">登 录</button>
    </div>
</div>

<div id="mainApp" style="display:none;">
    <div class="navbar">
        <div class="logo">
            <div class="logo-icon">🌂</div>
            <div>校园共享雨伞 · 管理后台</div>
        </div>
        <div class="right">
            <span class="time" id="clock"></span>
            <span class="logout" onclick="doLogout()">退出登录</span>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="menu-item active" data-page="stats" onclick="switchPage('stats')">
                <span class="menu-icon">📊</span>
                <span>数据概览</span>
            </div>
            <div class="menu-item" data-page="tasks" onclick="switchPage('tasks')">
                <span class="menu-icon">🔧</span>
                <span>信用修复审核</span>
                <span class="menu-badge" id="taskBadge" style="display:none;">0</span>
            </div>
            <div class="menu-item" data-page="appeals" onclick="switchPage('appeals')">
                <span class="menu-icon">💬</span>
                <span>用户申诉处理</span>
                <span class="menu-badge" id="appealBadge" style="display:none;">0</span>
            </div>
            <div class="menu-item" data-page="users" onclick="switchPage('users')">
                <span class="menu-icon">👥</span>
                <span>用户信息管理</span>
            </div>
            <div class="menu-item" data-page="orders" onclick="switchPage('orders')">
                <span class="menu-icon">📋</span>
                <span>借还订单查询</span>
            </div>
        </div>

        <div class="main" id="mainContent"></div>
    </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="imgModal" onclick="this.classList.remove('show')">
    <img id="modalImg" src="">
</div>

<script>
    const API = window.location.origin;
    let token = sessionStorage.getItem('adminToken') || '';
    let currentPage = 'stats';
    let ordersPage = 1;

    function doLogin() {
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPwd').value.trim();
        if (!username || !password) {
            document.getElementById('loginError').textContent = '请输入账号和密码';
            return;
        }
        fetch(`${API}/api/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    token = data.token;
                    sessionStorage.setItem('adminToken', token);
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    switchPage('stats');
                    startClock();
                } else {
                    document.getElementById('loginError').textContent = data.msg || '登录失败';
                }
            })
            .catch(() => {
                document.getElementById('loginError').textContent = '网络错误，请检查后端是否启动';
            });
    }

    function doLogout() {
        if (!confirm('确认退出登录？')) return;
        sessionStorage.removeItem('adminToken');
        location.reload();
    }

    function startClock() {
        function tick() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('clock').textContent =
                `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
                `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }
        tick();
        setInterval(tick, 1000);
    }

    function switchPage(page) {
        currentPage = page;
        document.querySelectorAll('.menu-item').forEach(el => {
            el.classList.toggle('active', el.dataset.page === page);
        });
        if (page === 'stats') loadStats();
        else if (page === 'tasks') loadTasks();
        else if (page === 'appeals') loadAppeals();
        else if (page === 'users') loadUsers();
        else if (page === 'orders') { ordersPage = 1; loadOrders(); }
    }

    function loadStats() {
        Promise.all([
            fetch(`${API}/api/admin/stats`).then(r => r.json()),
            fetch(`${API}/api/order/slots`).then(r => r.json()),
            fetch(`${API}/api/admin/trend`).then(r => r.json()).catch(() => ({ code: 0, data: [] }))
        ]).then(([statsRes, slotsRes, trendRes]) => {
            if (statsRes.code !== 200) return;
            const s = statsRes.data;
            updateBadge('taskBadge', s.pendingTask);
            updateBadge('appealBadge', s.pendingAppeal);

            let available = 0, empty = 0, total = 0;
            if (slotsRes.code === 200) {
                slotsRes.data.forEach(slot => {
                    const remain = slot['剩余数量'] || 0;
                    available += remain;
                    if (remain === 0) empty += 1;
                    total += 1;
                });
            }
            const availableRate = total > 0 ? Math.round((available / total) * 100) : 0;
            const trend7 = buildTrend7Days(trendRes.data || []);
            const maxCount = Math.max(...trend7.map(d => d.count), 1);

            document.getElementById('mainContent').innerHTML = `
      <div class="page-header">
        <div class="page-title">数据概览</div>
        <div class="page-sub">系统运行状态一览</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-head"><div class="stat-label">用户总数</div><div class="stat-icon">👥</div></div>
          <div class="stat-num">${s.userCount || 0}<span class="stat-unit">人</span></div>
        </div>
        <div class="stat-card green">
          <div class="stat-head"><div class="stat-label">今日借出</div><div class="stat-icon">📤</div></div>
          <div class="stat-num green">${s.todayBorrow || 0}<span class="stat-unit">次</span></div>
        </div>
        <div class="stat-card orange">
          <div class="stat-head"><div class="stat-label">当前未归还</div><div class="stat-icon">⏳</div></div>
          <div class="stat-num orange">${s.activeBorrow || 0}<span class="stat-unit">笔</span></div>
        </div>
        <div class="stat-card red">
          <div class="stat-head"><div class="stat-label">黑名单用户</div><div class="stat-icon">🚫</div></div>
          <div class="stat-num red">${s.blacklistCount || 0}<span class="stat-unit">人</span></div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-head">
            <div class="chart-title">近 7 天借出趋势</div>
            <div class="chart-sub">单位：次</div>
          </div>
          <div class="bar-chart">
            ${trend7.map(d => `
              <div class="bar-wrap">
                <div class="bar-value">${d.count}</div>
                <div class="bar" style="height: ${(d.count / maxCount) * 100}%;"></div>
                <div class="bar-label">${d.label}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-head">
            <div class="chart-title">伞位实时状态</div>
            <div class="chart-sub">共 ${total} 个伞位</div>
          </div>
          <div class="donut-wrap">
            <div class="donut" style="background: conic-gradient(#FBC7D4 0% ${availableRate}%, #FFE4A8 ${availableRate}% 100%);">
              <div class="donut-inner">
                <div class="donut-num">${availableRate}<span style="font-size:16px;">%</span></div>
                <div class="donut-label">可借率</div>
              </div>
            </div>
            <div style="display:flex;gap:24px;margin-top:20px;font-size:13px;">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="width:10px;height:10px;border-radius:50%;background:#FBC7D4;"></span>
                <span style="color:#c9b8a8;">可借 ${available}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="width:10px;height:10px;border-radius:50%;background:#FFE4A8;"></span>
                <span style="color:#c9b8a8;">空缺 ${empty}</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="charts-grid" style="grid-template-columns: 1fr 1fr 1fr;">
        <div class="stat-card orange">
          <div class="stat-head"><div class="stat-label">待审核修复任务</div><div class="stat-icon">🔧</div></div>
          <div class="stat-num orange">${s.pendingTask || 0}<span class="stat-unit">个</span></div>
        </div>
        <div class="stat-card orange">
          <div class="stat-head"><div class="stat-label">待处理用户申诉</div><div class="stat-icon">💬</div></div>
          <div class="stat-num orange">${s.pendingAppeal || 0}<span class="stat-unit">条</span></div>
        </div>
        <div class="stat-card green">
          <div class="stat-head"><div class="stat-label">累计借还笔数</div><div class="stat-icon">📈</div></div>
          <div class="stat-num green">${(s.todayBorrow || 0) + (s.activeBorrow || 0)}<span class="stat-unit">笔</span></div>
        </div>
      </div>
    `;
        });
    }

    function buildTrend7Days(data) {
        const result = [];
        const today = new Date();
        for (let i = 6; i >= 0; i--) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            const found = data.find(item => String(item.d || '').substring(0, 10) === dateStr);
            result.push({
                label: `${d.getMonth()+1}/${d.getDate()}`,
                count: found ? found.c : 0
            });
        }
        return result;
    }

    function updateBadge(id, count) {
        const el = document.getElementById(id);
        if (!el) return;
        if (count > 0) {
            el.textContent = count;
            el.style.display = 'inline-block';
        } else {
            el.style.display = 'none';
        }
    }

    function loadTasks() {
        fetch(`${API}/api/repair/pending`)
            .then(r => r.json())
            .then(data => {
                if (data.code !== 200) return;
                const list = data.data || [];
                updateBadge('taskBadge', list.length);
                let html = `
        <div class="page-header">
          <div class="page-title">信用修复审核</div>
          <div class="page-sub">审核用户提交的信用修复任务，通过后自动加信用分</div>
        </div>
      `;
                if (list.length === 0) {
                    html += `<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">暂无待审核的信用修复任务</div></div>`;
                } else {
                    html += '<div class="cards">';
                    list.forEach(t => {
                        html += `
            <div class="card">
              <div class="card-head">
                <div class="card-title">${t.任务名称 || '信用修复任务'}</div>
                <div class="card-score">+${t.加分值}</div>
              </div>
              <div class="card-row"><span class="label">卡号</span><span class="value">${t.校园卡号}</span></div>
              <div class="card-row"><span class="label">时间</span><span class="value">${t.提交时间 || ''}</span></div>
              ${t.审核备注 ? `<div class="card-row"><span class="label">备注</span><span class="value">${t.审核备注}</span></div>` : ''}
              ${t.提交照片 ? `<img class="card-img" src="${API}${t.提交照片}" onclick="openImg('${API}${t.提交照片}')" />` : ''}
              <div class="card-actions">
                <button class="btn btn-pass" onclick="passTask(${t.任务ID}, this)">✓ 通过</button>
                <button class="btn btn-reject" onclick="rejectTask(${t.任务ID})">✗ 驳回</button>
              </div>
            </div>
          `;
                    });
                    html += '</div>';
                }
                document.getElementById('mainContent').innerHTML = html;
            });
    }

    function passTask(id, btn) {
        if (!confirm('确认通过？通过后自动加信用分。')) return;
        btn.disabled = true;
        fetch(`${API}/api/repair/audit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ taskId: id, result: '通过' })
        }).then(r => r.json()).then(d => {
            if (d.code === 200) { toast('已通过', 'success'); loadTasks(); }
            else { toast(d.msg || '操作失败', 'error'); btn.disabled = false; }
        });
    }

    function rejectTask(id) {
        const reason = prompt('请输入驳回理由（可选）：');
        if (reason === null) return;
        fetch(`${API}/api/repair/audit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ taskId: id, result: '驳回', remark: reason })
        }).then(r => r.json()).then(d => {
            if (d.code === 200) { toast('已驳回', 'success'); loadTasks(); }
            else { toast(d.msg || '操作失败', 'error'); }
        });
    }

    function loadAppeals() {
        fetch(`${API}/api/appeal/pending`)
            .then(r => r.json())
            .then(data => {
                if (data.code !== 200) return;
                const list = data.data || [];
                updateBadge('appealBadge', list.length);
                let html = `
        <div class="page-header">
          <div class="page-title">用户申诉处理</div>
          <div class="page-sub">处理用户对扣分、赔偿的申诉请求</div>
        </div>
      `;
                if (list.length === 0) {
                    html += `<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">暂无待处理的用户申诉</div></div>`;
                } else {
                    html += '<div class="cards">';
                    list.forEach(a => {
                        html += `
            <div class="card">
              <div class="card-head">
                <div class="card-title">申诉单 #${a.申诉ID}</div>
              </div>
              <div class="card-row"><span class="label">卡号</span><span class="value">${a.校园卡号}</span></div>
              <div class="card-row"><span class="label">关联ID</span><span class="value">${a.关联记录ID || '—'}</span></div>
              <div class="card-row"><span class="label">申诉内容</span><span class="value">${a.申诉内容 || ''}</span></div>
              <div class="card-row"><span class="label">提交时间</span><span class="value">${a.创建时间 || ''}</span></div>
              <div class="card-actions">
                <button class="btn btn-pass" onclick="passAppeal(${a.申诉ID}, this)">✓ 通过</button>
                <button class="btn btn-reject" onclick="rejectAppeal(${a.申诉ID})">✗ 驳回</button>
              </div>
            </div>
          `;
                    });
                    html += '</div>';
                }
                document.getElementById('mainContent').innerHTML = html;
            });
    }

    function passAppeal(id, btn) {
        if (!confirm('确认通过此申诉？')) return;
        btn.disabled = true;
        fetch(`${API}/api/appeal/audit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ appealId: id, result: '通过' })
        }).then(r => r.json()).then(d => {
            if (d.code === 200) { toast('已通过', 'success'); loadAppeals(); }
            else { toast(d.msg || '操作失败', 'error'); btn.disabled = false; }
        });
    }

    function rejectAppeal(id) {
        const reason = prompt('请输入驳回理由（可选）：');
        if (reason === null) return;
        fetch(`${API}/api/appeal/audit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ appealId: id, result: '驳回', remark: reason })
        }).then(r => r.json()).then(d => {
            if (d.code === 200) { toast('已驳回', 'success'); loadAppeals(); }
            else { toast(d.msg || '操作失败', 'error'); }
        });
    }

    function loadUsers(keyword) {
        const url = `${API}/api/admin/users` + (keyword ? '?keyword=' + encodeURIComponent(keyword) : '');
        fetch(url).then(r => r.json()).then(data => {
            if (data.code !== 200) return;
            const list = data.data || [];
            let html = `
      <div class="page-header">
        <div class="page-title">用户信息管理</div>
        <div class="page-sub">查看所有用户，可拉黑或解封违规账号</div>
      </div>
      <div class="search-bar">
        <input type="text" id="userSearch" placeholder="搜索学号 / 姓名 / 卡号" value="${keyword || ''}" />
        <button onclick="searchUsers()">🔍 搜索</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>学号</th><th>姓名</th><th>校园卡号</th><th>信用分</th><th>账号状态</th><th>操作</th>
          </tr></thead>
          <tbody>
    `;
            if (list.length === 0) {
                html += `<tr><td colspan="6" style="text-align:center;color:#c9b8a8;padding:60px;">暂无用户数据</td></tr>`;
            } else {
                list.forEach(u => {
                    const isBlack = u.是否黑名单 === 1;
                    html += `
          <tr>
            <td><strong>${u.学号 || '—'}</strong></td>
            <td>${u.姓名 || '—'}</td>
            <td style="font-family:monospace;font-size:12px;">${u.校园卡号 || '—'}</td>
            <td><strong style="font-size:15px;color:${u.信用分 < 60 ? '#ef4444' : '#10b981'};">${u.信用分 ?? 100}</strong></td>
            <td><span class="tag ${isBlack ? 'black' : 'normal'}">${isBlack ? '已拉黑' : '正常'}</span></td>
            <td>
              <button class="btn ${isBlack ? 'btn-pass' : 'btn-black'}"
                      onclick="toggleBlack('${u.校园卡号}', ${isBlack ? 0 : 1}, this)">
                ${isBlack ? '解除拉黑' : '拉黑账号'}
              </button>
            </td>
          </tr>
        `;
                });
            }
            html += '</tbody></table></div>';
            document.getElementById('mainContent').innerHTML = html;
            const s = document.getElementById('userSearch');
            if (s) s.addEventListener('keypress', e => { if (e.key === 'Enter') searchUsers(); });
        });
    }

    function searchUsers() {
        loadUsers(document.getElementById('userSearch').value.trim());
    }

    function toggleBlack(cardId, blacklisted, btn) {
        const text = blacklisted === 1 ? '拉黑' : '解封';
        if (!confirm(`确认${text}该用户？`)) return;
        btn.disabled = true;
        fetch(`${API}/api/admin/user/blacklist`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cardId, blacklisted })
        }).then(r => r.json()).then(d => {
            if (d.code === 200) { toast(d.msg, 'success'); loadUsers(); }
            else { toast(d.msg || '操作失败', 'error'); btn.disabled = false; }
        });
    }

    function loadOrders() {
        fetch(`${API}/api/admin/orders?page=${ordersPage}&size=20`)
            .then(r => r.json())
            .then(data => {
                if (data.code !== 200) return;
                const list = data.data || [];
                const total = data.total || 0;
                const totalPages = Math.max(1, Math.ceil(total / 20));
                let html = `
        <div class="page-header">
          <div class="page-title">借还订单查询</div>
          <div class="page-sub">共 ${total} 条借还记录</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>订单ID</th><th>学号</th><th>姓名</th><th>伞位</th>
              <th>借出时间</th><th>归还时间</th><th>订单状态</th><th>信用变动</th>
            </tr></thead>
            <tbody>
      `;
                if (list.length === 0) {
                    html += `<tr><td colspan="8" style="text-align:center;color:#c9b8a8;padding:60px;">暂无借还记录</td></tr>`;
                } else {
                    list.forEach(o => {
                        const status = o.记录状态 === 0
                            ? '<span class="tag pending">借出中</span>'
                            : '<span class="tag pass">已归还</span>';
                        const creditClass = o.信用变动 > 0 ? 'color:#10b981;font-weight:600;' : (o.信用变动 < 0 ? 'color:#ef4444;font-weight:600;' : '');
                        html += `
            <tr>
              <td>#${o.记录ID}</td>
              <td><strong>${o.学号 || '—'}</strong></td>
              <td>${o.姓名 || '—'}</td>
              <td>${o.伞位编号} 号位</td>
              <td style="font-size:12px;color:#c9b8a8;">${o.借出时间 || '—'}</td>
              <td style="font-size:12px;color:#c9b8a8;">${o.归还时间 || '—'}</td>
              <td>${status}</td>
              <td style="${creditClass}">${o.信用变动 > 0 ? '+' : ''}${o.信用变动 || 0}</td>
            </tr>
          `;
                    });
                }
                html += '</tbody></table></div>';
                html += `
        <div class="pagination">
          <button onclick="changeOrderPage(-1)" ${ordersPage <= 1 ? 'disabled' : ''}>← 上一页</button>
          <span class="page-info">第 ${ordersPage} / ${totalPages} 页</span>
          <button onclick="changeOrderPage(1)" ${ordersPage >= totalPages ? 'disabled' : ''}>下一页 →</button>
        </div>
      `;
                document.getElementById('mainContent').innerHTML = html;
            });
    }

    function changeOrderPage(delta) {
        ordersPage += delta;
        if (ordersPage < 1) ordersPage = 1;
        loadOrders();
    }

    function openImg(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imgModal').classList.add('show');
    }

    let toastTimer = null;
    function toast(msg, type) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast show ' + (type || '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    if (token) {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        switchPage('stats');
        startClock();
    }
</script>
</body>
</html>
